
name: Build WhatsBit APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Android project files are missing"
            exit 1
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsBit-APK
          path: app/build/outputs/apk/debug/*.apk
          
